# Smart Classroom — containerized stack (Linux)

services:
  model-cache-permissions:
    profiles: ["text-gen"]
    image: python:3.12-slim
    container_name: sc-model-cache-permissions
    command: >-
      sh -lc "
        mkdir -p /opt/models/ovms/openvino_models &&
        chown -R 1000:1000 /opt/models &&
        find /opt/models -type d -exec chmod 0775 {} + &&
        find /opt/models -type f -exec chmod 0664 {} +
      "
    volumes:
      - model-cache:/opt/models
    restart: "no"
    networks: [smart-classroom]

  storage-permissions:
    image: python:3.12-slim
    container_name: sc-storage-permissions
    command: >-
      sh -lc "
        mkdir -p /app/storage/smart-classroom /app/storage/content-search &&
        chown -R 10001:10001 /app/storage &&
        find /app/storage -type d -exec chmod 0775 {} + &&
        find /app/storage -type f -exec chmod 0664 {} +
      "
    volumes:
      - ${STORAGE_DIR:-../storage}:/app/storage
    restart: "no"
    networks: [smart-classroom]

  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
        # Forward the host proxy (if any) so npm/pip can fetch packages.
        HTTP_PROXY: "${HTTP_PROXY:-${http_proxy:-}}"
        HTTPS_PROXY: "${HTTPS_PROXY:-${https_proxy:-}}"
        NO_PROXY: "${NO_PROXY:-${no_proxy:-}}"
      # Optional corporate TLS-inspection CA, see app.Dockerfile and the
      # `secrets.corporate_ca` entry below. No-op unless CORPORATE_CA_FILE
      # points at a real PEM file.
      secrets:
        - corporate_ca
      # On some TLS-inspecting corporate proxies (observed: Fortinet), large
      # downloads through docker's NAT'd bridge build network intermittently
      # get a 504 from the proxy (the same request succeeds from the host's
      # own network) -- this affects the GPU-runtime .deb downloads in
      # app.Dockerfile. `host` routes build RUN steps through the host's
      # network stack instead, same as `docker build --network host`.
      network: host
    image: smart-classroom-app:local
    container_name: smart-classroom-app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped
    networks: [smart-classroom]
    group_add:
      - "1000"
      - "${RENDER_GID:?Set RENDER_GID to the host render-group ID; run ./setup.sh}"
    devices:
      - "/dev/dri:/dev/dri"
    depends_on:
      storage-permissions: { condition: service_completed_successfully }
      metrics-collector: { condition: service_healthy }
    environment:
      - METRICS_COLLECTOR_URL=http://metrics-collector:9000
      - AUDIO_ANALYZER_URL=http://audio-analyzer:8010
      - SERVING_BASE_URL=${SERVING_BASE_URL:-http://ovms:9000}
      - VIDEO_ANALYTICS_URL=${VIDEO_ANALYTICS_URL:-http://video-analytics:8020}
      - HF_HOME=/app/models/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - HTTP_PROXY=${HTTP_PROXY:-${http_proxy:-}}
      - HTTPS_PROXY=${HTTPS_PROXY:-${https_proxy:-}}
      - NO_PROXY=localhost,127.0.0.1,::1,${NO_PROXY:-${no_proxy:-}}
      - http_proxy=${HTTP_PROXY:-${http_proxy:-}}
      - https_proxy=${HTTPS_PROXY:-${https_proxy:-}}
      - no_proxy=localhost,127.0.0.1,::1,${NO_PROXY:-${no_proxy:-}}
    volumes:
      - ${STORAGE_DIR:-../storage}:/app/storage
      - model-cache:/app/models
    # NOTE: no hard `depends_on: ovms` here — `ovms` carries the "text-gen"
    # Compose profile while `app` is unprofiled (always-on), and
    # `docker compose config` errors if an unprofiled service hard-depends on
    # a profile that isn't active (see repo memory: containerization
    # skeleton). SERVING_BASE_URL is treated as optional at runtime instead;
    # the app only calls it when text-gen is enabled in config.yaml.
    # Content Search runs inside app when enabled by the feature resolver.
    # Its localhost-only APIs are exposed through app's same-origin proxy;
    # SQLite, ChromaDB and uploaded files persist under /app/storage/content-search.

  metrics-collector:   # telemetry sidecar: CPU/GPU/NPU/memory/power -> /metrics, /platform-info
    image: ${METRICS_COLLECTOR_IMAGE:-intel/retail-benchmark:latest}
    container_name: sc-metrics-collector
    # privileged + host /proc,/sys are required by sar/free/qmassa/PCM inside
    # the performance-tools image; this does not require network_mode: host,
    # so the container stays reachable at the DNS name "metrics-collector"
    # from the app service on the bridge network below.
    privileged: true
    environment:
      - RESULTS_DIR=/tmp/results
      - NPU_LOG=/tmp/results/npu_usage.csv
      - METRICS_HTTP_PORT=9000
    volumes:
      - metrics:/tmp/results
      - /sys:/sys:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/class/drm:/sys/class/drm:ro
    ports:
      # Host-published so `curl http://localhost:9100/metrics` works for
      # manual verification without exec-ing into the container.
      - "9100:9000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9000/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks: [smart-classroom]

  audio-analyzer:   
    profiles: ["asr"]
    image: intel/audio-analyzer
    pull_policy: always
    container_name: sc-audio-analyzer
    user: "1000:1000"
    environment:
      HF_HOME: /app/audio_analyzer/.cache/huggingface
      # ZE_ENABLE_ALT_DRIVERS is required for Intel NPU enumeration (GPU override).
      ZE_ENABLE_ALT_DRIVERS: libze_intel_npu.so
      # HF_TOKEN is only needed when the service runs diarization (gated models).
      HF_TOKEN: "${HF_TOKEN:-}"
      AUDIO_ANALYZER_SERVER_PORT: "8010"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-}"
    volumes:
      # Editable service config (ASR provider/model/device, diarization).
      - ../edge-ai-libraries/microservices/audio-analyzer/config.yaml:/app/audio_analyzer/config.yaml:ro
      - audio-analyzer-models:/app/audio_analyzer/models
      - audio-analyzer-chunks:/app/audio_analyzer/chunks
      - audio-analyzer-storage:/app/audio_analyzer/storage
      - audio-analyzer-cache:/app/audio_analyzer/.cache
    healthcheck:
      # The port only binds after startup preloads models. First run downloads
      # them (FunASR paraformer-zh ~900MB + VAD/punc, or Whisper) which, on a
      # slow/proxied network, can take far longer than a Whisper GPU warmup —
      # so start_period must cover that one-time download or the container is
      # wrongly flagged unhealthy before it ever serves. Models persist to the
      # audio-analyzer-models volume, so subsequent starts are fast.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"
      interval: 15s
      timeout: 10s
      start_period: 1800s
      retries: 5
    restart: unless-stopped
    networks: [smart-classroom]

  model-downloader:  
    profiles: ["text-gen"]
    build:
      context: ../edge-ai-libraries/microservices/model-download
      dockerfile: docker/Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: sc-model-downloader:local
    container_name: sc-model-downloader
    command: --plugins ${ENABLED_PLUGINS:-huggingface,openvino}
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - MODEL_PATH=/opt/models
      - ENABLED_PLUGINS=${ENABLED_PLUGINS:-huggingface,openvino}
      - STARTUP_MODELS_CONFIG=/opt/startup-models.yaml
      - OVMS_RELEASE_TAG=${OVMS_RELEASE_TAG:-v2026.4.1}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - TRANSFORMERS_VERBOSITY=error
      - PYTHONWARNINGS=ignore
      - HF_HUB_DISABLE_PROGRESS_BARS=1
      - TQDM_DISABLE=1
    volumes:
      - model-cache:/opt/models
      - ../components/vlm/config/startup-models.yaml:/opt/startup-models.yaml:ro
    depends_on:
      model-cache-permissions: { condition: service_completed_successfully }
    ports:
      - "8200:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 1800s
      retries: 5
    restart: unless-stopped
    networks: [smart-classroom]

  ovms-provision:
    profiles: ["text-gen"]
    build:
      context: ..
      dockerfile: docker/ovms-provision.Dockerfile
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: sc-ovms-provision:local
    container_name: sc-ovms-provision
    environment:
      - OVMS_MODELS_ROOT=/opt/models/ovms
      - STARTUP_MODELS_CONFIG=/opt/startup-models.yaml
      - MODEL_DOWNLOADER_URL=http://model-downloader:8000
    volumes:
      - model-cache:/opt/models
      - ../components/vlm/config/startup-models.yaml:/opt/startup-models.yaml:ro
    depends_on:
      model-cache-permissions: { condition: service_completed_successfully }
      model-downloader: { condition: service_healthy }
    restart: "no"
    networks: [smart-classroom]

  ovms:               # OpenVINO Model Server (:9000, internal only)
    profiles: ["text-gen"]
    # 2026.3.x segfaults in Tokenizer() on the OpenVINO/Qwen3-VL-8B-Instruct-int4-ov IR
    # (tokenizer exported with a newer openvino_tokenizers); 2026.4.1+ loads it.
    # Keep model-downloader's OVMS_RELEASE_TAG (.env) aligned with this tag.
    image: openvino/model_server:2026.4.1-gpu
    container_name: sc-ovms
    command: >-
      --rest_port 9000 --config_path /models/ovms/config.json
    volumes:
      - model-cache:/models:ro
    shm_size: "2gb"
    depends_on:
      model-downloader: { condition: service_healthy }
      ovms-provision: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 12
    restart: unless-stopped
    networks: [smart-classroom]

  # content-search:     # RAG / multimodal backend (:9011, internal only)
  #   profiles: ["content-search"]
  #   build:
  #     context: .
  #     dockerfile: docker/content-search.Dockerfile
  #   depends_on:
  #     ovms: { condition: service_healthy }
  #   restart: unless-stopped
  #   networks: [smart-classroom]

  va-model-provision:  # one-shot: export VA OpenVINO IR models into the model volume
    profiles: ["va"]
    build:
      context: ../video-analytics
      dockerfile: docker/Dockerfile.va-provision
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
      secrets:
        - corporate_ca
    image: sc-va-model-provision:local
    container_name: sc-va-model-provision
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - no_proxy=${NO_PROXY:-}
    volumes:
      - video-analytics-models:/app/models
    restart: "no"
    networks: [smart-classroom]

  mediamtx:            # RTSP ingest + WebRTC/HLS relay for annotated VA streams
    profiles: ["va"]
    image: ${VA_MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.20.0}
    container_name: sc-mediamtx
    environment:
      # Inter-container RTSP must bypass any corporate proxy baked into the
      # dlstreamer image, or rtspclientsink's connect fails with
      # "HTTP proxy connection failed".
      - no_proxy=mediamtx,video-analytics,localhost,127.0.0.1,${NO_PROXY:-}
      - NO_PROXY=mediamtx,video-analytics,localhost,127.0.0.1,${NO_PROXY:-}
    ports:
      - "${VA_MEDIAMTX_RTSP_PORT:-8554}:8554"            # RTSP (publish + read)
      - "${VA_MEDIAMTX_HLS_PORT:-8888}:8888"             # HLS (browser playback)
      - "${VA_MEDIAMTX_WEBRTC_PORT:-8889}:8889"          # WebRTC (browser playback, signaling)
      - "${VA_MEDIAMTX_WEBRTC_ICE_PORT:-8189}:8189/udp"  # WebRTC ICE/UDP
    restart: unless-stopped
    networks: [smart-classroom]

  video-analytics:     # DL Streamer VA pipeline engine (control API on :8020)
    profiles: ["va"]
    build:
      context: ../video-analytics
      dockerfile: docker/Dockerfile.va-pipeline
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-}"
    image: sc-video-analytics:local
    container_name: sc-video-analytics
    environment:
      - VA_PORT=8020
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=mediamtx,video-analytics,localhost,127.0.0.1,${NO_PROXY:-}
      - NO_PROXY=mediamtx,video-analytics,localhost,127.0.0.1,${NO_PROXY:-}
      # VA pipeline behaviour; unset -> defaults baked into
      # va_pipeline_service.py's __init__.
      - VA_RTSP_CODEC=${VA_RTSP_CODEC:-h264}
      - VA_RTSP_ENCODER_BACKEND=${VA_RTSP_ENCODER_BACKEND:-va}
      - VA_POSE_MIN_FRAMES_FOR_TRANSITION=${VA_POSE_MIN_FRAMES_FOR_TRANSITION:-3}
      - VA_POSE_MIN_FRAMES_FOR_TRANSITION_UNID=${VA_POSE_MIN_FRAMES_FOR_TRANSITION_UNID:-15}
      - VA_POSE_ABSENCE_THRESHOLD=${VA_POSE_ABSENCE_THRESHOLD:-90}
      - VA_POSE_MIN_STAND_FRAMES=${VA_POSE_MIN_STAND_FRAMES:-10}
      - VA_POSE_CENTER_DIST_THRESHOLD=${VA_POSE_CENTER_DIST_THRESHOLD:-0.1}
      - VA_POSE_UNIDENTIFIED_MAX=${VA_POSE_UNIDENTIFIED_MAX:-50}
      - VA_POSE_STALE_UNIDENTIFIED_THRESHOLD=${VA_POSE_STALE_UNIDENTIFIED_THRESHOLD:-30}
      - VA_POSE_STUDENT_COUNT_WINDOW_FRAMES=${VA_POSE_STUDENT_COUNT_WINDOW_FRAMES:-150}
      # Per-pipeline default device; a launch call may still override it.
      # NPU/GPU (default) need docker-compose.gpu.yml for device passthrough.
      # CPU needs no passthrough for inference itself -- see the VA pipeline
      # guide (dev-guide/va-pipeline) section "Device selection" -- but RTSP
      # sources still decode on the GPU regardless of device, so /dev/dri is
      # still required unless every source is a file.
      - VA_FRONT_DEVICE=${VA_FRONT_DEVICE:-NPU}
      - VA_BACK_DEVICE=${VA_BACK_DEVICE:-NPU}
      - VA_CONTENT_DEVICE=${VA_CONTENT_DEVICE:-NPU}
    volumes:
      - video-analytics-models:/app/models:ro
      - ${STORAGE_DIR:-../storage}:/app/storage
    # NPU/GPU device passthrough lives in docker-compose.gpu.yml (opt-in).
    depends_on:
      va-model-provision: { condition: service_completed_successfully }
      mediamtx: { condition: service_started }
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8020/health').status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks: [smart-classroom]

networks:
  smart-classroom:
    driver: bridge

volumes:
  model-cache:
  metrics:
  video-analytics-models:
  audio-analyzer-models:
  audio-analyzer-chunks:
  audio-analyzer-storage:
  audio-analyzer-cache:

secrets:
  # Optional corporate TLS-inspection root CA (PEM), shared by the `app`
  # build's GPU/NPU-runtime step (docker/app.Dockerfile) and the
  # `va-model-provision` build's model-download step
  # (video-analytics/docker/Dockerfile.va-provision). Defaults to a tracked
  # empty placeholder (0 bytes), which keeps this a verified no-op for
  # everyone who doesn't need it.
  corporate_ca:
    file: "${CORPORATE_CA_FILE:-./corporate-ca.placeholder.pem}"