appId: com.intel.openedgeplatform.educationaisuite.smartclassroom
productName: Smart Classroom
directories:
  output: release
# Bundle the built UI + the additive electron layer. Production `dependencies`
# (express, http-proxy-middleware) are picked up automatically by electron-builder.
files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - nsis
  # Signing runs only when SC_CODESIGN_SCRIPT is set (see build/sign.cjs).
  signtoolOptions:
    sign: ./build/sign.cjs
    # The hook is called once per algorithm; the signing service handles digests.
    signingHashAlgorithms:
      - sha256
  # Default is .exe only; also sign Electron DLLs and native addons.
  signExts:
    - .dll
    - .node
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Smart Classroom
  artifactName: SmartClassroom-${version}-setup.exe
  include: build/installer.nsh
extraResources:
  - from: ..
    to: backend
    filter:
      - '**/*'
      - '!**/node_modules/**'
      - '!**/dist/**'
      - '!**/release/**'
      - '!**/logs/**'
      - '!**/.git/**'
      - '!**/__pycache__/**'
      - '!**/*.py[cod]'
      - '!**/.env'
      - '!**/.proxy-config'
      - '!**/models/**'
      - '!**/venv_convert/**'
      - '!**/.pytest_cache/**'
